<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma cave à vin</title>
<meta name="theme-color" content="#5e1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Ambiance « Étiquette » : papier ivoire, bordeaux profond, filets dorés, titres à empattements. */
:root{
  --bg:#f6f0e4; --card:#fffcf6; --ink:#2b1a17; --muted:#7a665d; --line:#e3d5bf;
  --accent:#6e1424; --accent-soft:#f3e4dc; --gold:#a07a2c; --gold-soft:#eadcba; --wash:#efe5d3;
  --head1:#6e1424; --head2:#4a0c17; --head-ink:#fbf3e6; --head-gold:#e3c27c;
  --c-rouge:#7a1a2c; --c-blanc:#c99a2e; --c-rose:#d9707f; --c-champagne:#9a7a1c; --c-autre:#6a5bb0;
  --shadow:0 1px 2px rgba(70,35,20,.06),0 6px 18px rgba(70,35,20,.07);
  --serif:"EB Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191112; --card:#241a1b; --ink:#f2e8da; --muted:#b39f90; --line:#3b2c2a;
  --accent:#d0566a; --accent-soft:#3a2224; --gold:#d4b36a; --gold-soft:#4a3c26; --wash:#2d2221;
  --head1:#3c0c16; --head2:#24080d; --head-ink:#f6ebdc; --head-gold:#d9b86e;
  --c-rouge:#d0566a; --c-blanc:#e0b84a; --c-rose:#f08aa0; --c-champagne:#b89030; --c-autre:#9a8ae0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,svg text{font-variant-numeric:lining-nums}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* En-tête */
header{position:sticky;top:0;z-index:5;background:linear-gradient(160deg,var(--head1),var(--head2));color:var(--head-ink);padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--head-gold)}
header h1{margin:0;font:600 26px/1 var(--serif);letter-spacing:.01em}
header .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-gold);margin-top:4px}
header .acts{display:flex;gap:2px}
header .acts button{background:none;border:0;color:var(--head-ink);padding:8px;border-radius:50%;display:flex}
header .acts button:active{background:rgba(255,255,255,.12)}

main{padding:14px 16px 110px;max-width:720px;margin:0 auto}
h2{font:600 20px/1.2 var(--serif);margin:24px 0 10px}
.view-title{font:600 24px/1.15 var(--serif);margin:4px 0 12px}

/* Champs */
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
select{-webkit-appearance:none;appearance:none;padding-right:34px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px;border-radius:999px}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--accent);color:#fff;margin-top:12px;box-shadow:var(--shadow);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.btn .ic{width:20px;height:20px}

/* Filtres */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:14px;transition:background .15s,color .15s,border-color .15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
.filters{display:flex;gap:8px;margin-top:8px}.filters>*{flex:1;min-width:0}
.filters select{padding:8px 32px 8px 14px;font-size:14px;border-radius:999px}
.summary{color:var(--muted);font-size:13px;margin:12px 0 4px;font-variant-numeric:lining-nums tabular-nums}

/* Séparateur façon étiquette */
.group{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:20px 0 10px}
.group::before,.group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft) 30%,var(--gold-soft) 70%,transparent)}

/* Couleurs de vin */
.k-rouge{--c:var(--c-rouge)}.k-blanc{--c:var(--c-blanc)}.k-rose{--c:var(--c-rose)}.k-champagne{--c:var(--c-champagne)}.k-autre{--c:var(--c-autre)}

/* Cartes vin */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 10px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .12s}
.card.tap:active{transform:scale(.985)}
.btl{width:16px;height:40px;flex:none;color:var(--c)}
.grow{flex:1;min-width:0}
.dom{font:600 17.5px/1.2 var(--serif);overflow-wrap:anywhere}
.app{font-size:14px;margin-top:2px}
.app i{font-family:var(--serif);font-size:14.5px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:2px}
.vint{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.vint b{font:600 19px/1 var(--serif);color:var(--gold);font-variant-numeric:lining-nums}
.vint span{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}

.empty{text-align:center;color:var(--muted);padding:36px 10px}
.empty .ic{width:40px;height:40px;color:var(--gold);stroke-width:1.3;display:block;margin:0 auto 8px}
.empty b{display:block;font:600 18px var(--serif);color:var(--ink);margin-bottom:4px}

/* Casier */
.places{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.place.wide{grid-column:1/-1}
.place{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow);transition:transform .12s}
.place:active{transform:scale(.98)}
.place .ph{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.place .zn{font:600 18px/1 var(--serif)}
.place .zc{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.place .pc{font-size:12px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.place .pc b{color:var(--ink);font-weight:600}
.place.vide{background:transparent;border-style:dashed;box-shadow:none}
.rack{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-radius:8px;background:var(--wash);box-shadow:inset 0 1px 3px rgba(0,0,0,.08);min-height:40px;align-content:flex-start}
.rack.big{gap:6px;padding:12px;--s:24px;margin:4px 0 6px}
.cul{width:var(--s,15px);height:var(--s,15px);border-radius:50%;flex:none;
  background:radial-gradient(circle,rgba(0,0,0,.32) 0 20%,transparent 23%),radial-gradient(circle at 32% 28%,rgba(255,255,255,.5) 0 9%,transparent 12%),var(--c);
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.12);animation:pop .35s both;animation-delay:calc(var(--i,0) * 18ms)}
.cul.libre{background:none;box-shadow:inset 0 0 0 1.5px var(--line);animation:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;margin:-4px 0 2px}
.back .ic{width:18px;height:18px}

/* Fiche vin : une étiquette */
.label{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;padding:26px 18px 20px;box-shadow:var(--shadow);overflow:hidden}
.label::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold-soft);border-radius:6px;pointer-events:none}
.label::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c);z-index:1}
.label::before{z-index:1}
.label>div{position:relative;z-index:1}
.label .wm{position:absolute;left:4%;bottom:10px;width:92%;height:78%;color:var(--gold);opacity:.4;pointer-events:none;z-index:0}
.wm .pl{fill:var(--card)}
.wm g,.wm path,.wm line,.wm rect,.wm circle,.wm ellipse,.wm polygon{vector-effect:non-scaling-stroke}
.lab-reg{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.lab-dom{font:700 25px/1.15 var(--serif);margin:10px 0 6px;text-wrap:balance}
.lab-app{font-size:15px}
.lab-cuv{font:italic 500 17px/1.3 var(--serif);color:var(--muted);margin-top:2px}
.lab-vint{font:600 38px/1 var(--serif);color:var(--gold);margin-top:14px;letter-spacing:.02em}
.lab-orn{width:60px;height:1px;background:var(--gold-soft);margin:12px auto 0}
.facts{display:flex;gap:8px;margin-top:10px}
.facts div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wash);border-radius:10px;padding:10px 6px;font-size:14px;font-weight:500}
.facts .ic{width:18px;height:18px;color:var(--gold)}

/* Volet du bas */
.sheet{position:fixed;inset:0;z-index:10}
.sheet-bg{position:absolute;inset:0;background:rgba(20,8,8,.5);opacity:0;transition:opacity .25s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:none}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{margin-top:4px}
.sheet .sub{font:italic 500 15.5px var(--serif);color:var(--muted);margin-top:-6px}
/* Fiche vin : bouteilles et emplacements */
.count{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--wash);text-align:left}
.count b{font-weight:600}
.count span{flex:1;color:var(--muted);font-size:13px;text-align:right}
.count>.ic,.loc>.ic:last-child,.opt>.ic:last-child{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.count[aria-expanded="true"]>.ic{transform:rotate(90deg)}
.locs{display:flex;flex-direction:column;gap:6px;margin-top:6px;animation:rise .25s cubic-bezier(.2,.8,.2,1)}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.loc,.opt{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;font-size:15px}
.loc span,.opt span{flex:1;min-width:0}
.loc b{font-weight:600;font-size:14px;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.loc>.ic:first-child,.opt>.ic:first-child{width:18px;height:18px;color:var(--gold)}
.opt small{display:block;font-size:12px;color:var(--muted)}
.opts .group{margin:12px 0 4px}
.row3{display:flex;gap:8px}.row3>.btn{flex:1;min-width:0;padding:12px 4px;font-size:14px;gap:5px}
.row3>.btn .ic{width:17px;height:17px}
.qty{display:flex;align-items:center;justify-content:center;gap:22px;margin:18px 0 6px}
.qty button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1;color:var(--accent)}
.qty b{font:600 36px var(--serif);min-width:54px;text-align:center;font-variant-numeric:lining-nums}
.locq{display:flex;align-items:center;gap:10px;margin-top:8px}
.locq span{flex:1;font-size:15px}
.locq input{width:84px;text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font-size:14px;transition:background .15s,color .15s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* Bues */
.note{flex:none;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.note b{font:600 17px var(--serif)}
.note span{font-size:9px;color:var(--muted);margin-top:1px}
.date{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--wash);color:var(--ink)}
.tag .ic{width:14px;height:14px}
.quote{font:italic 500 15.5px/1.4 var(--serif);color:var(--muted);margin-top:6px}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font:600 26px/1.15 var(--serif);font-variant-numeric:lining-nums}
.kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{width:140px;height:140px;flex:none}
.donut circle.seg{transition:opacity .15s}
.donut:hover circle.seg{opacity:.45}.donut circle.seg:hover{opacity:1}
.donut .tot{font:600 30px var(--serif);fill:var(--ink)}
.donut .tl{font:600 9px var(--sans);letter-spacing:.12em;fill:var(--muted)}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.dleg div{display:flex;align-items:center;gap:8px}
.dleg i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dleg span{flex:1;min-width:0}
.dleg b{font-variant-numeric:lining-nums tabular-nums;font-weight:600}
.dleg em{font-style:normal;color:var(--muted);font-size:12px;width:34px;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.chart{position:relative}
.chart .legend{margin:0 0 10px}
.colchart svg{width:100%;height:auto;display:block;overflow:visible}
.colchart .seg{fill:var(--c);pointer-events:none}
.colchart .hit{fill:transparent;cursor:pointer}
.colchart .col,.hbar{transition:opacity .15s}
.chart.focus .col:not(.hl),.chart.focus .hbar:not(.hl){opacity:.35}
.colchart .ax{font:500 9px var(--sans);fill:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.colchart .vl{font:600 11px var(--sans);fill:var(--ink)}
.colchart .base{stroke:var(--line);stroke-width:1}
.tip{position:absolute;z-index:2;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;white-space:nowrap;transform:translateY(-100%);margin-top:-8px;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:6px;line-height:1.6;font-variant-numeric:lining-nums tabular-nums}
.tip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.hbar{display:flex;align-items:center;gap:10px;font-size:14px;padding:4px 0;cursor:pointer}
.hbar .l{width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .t{flex:1;height:10px;background:var(--wash);border-radius:5px;overflow:hidden}
.hbar .f{height:100%;display:flex;gap:2px;transform-origin:left;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
.hbar .f i{display:block;height:100%;background:var(--c)}
.hbar .f i:last-child{border-radius:0 5px 5px 0}
.hbar .n{width:26px;text-align:right;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.note-s{font-size:12px;color:var(--muted);margin-top:8px}

/* Barre d'onglets */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;box-shadow:0 -4px 16px rgba(70,35,20,.06)}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 8px;font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
nav button.on{color:var(--accent)}
nav button.on .ic{stroke-width:2}
nav button.add .plus{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:linear-gradient(160deg,var(--head1),var(--head2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--head-gold),0 6px 14px rgba(70,20,20,.3);transition:transform .15s}
nav button.add:active .plus{transform:scale(.94)}
nav button.add .plus .ic{width:26px;height:26px;stroke-width:2.2}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.4;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;width:max-content;max-width:calc(100vw - 32px);border-radius:18px}
#toast.act span{min-width:0}
#toast button{border:0;background:none;color:var(--head-gold);font-weight:600;font-size:14px;padding:6px 10px;border-radius:999px}
#toast button:active{background:rgba(255,255,255,.12)}
header .acts #pending{border-radius:999px;gap:5px;align-items:center;padding:6px 11px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600}
header .acts #pending .ic{width:18px;height:18px}
/* Dégustations passées dans la fiche */
.tasts{display:flex;flex-direction:column;gap:8px}
.tast{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tast .note{width:44px;height:44px}
.tast .note b{font-size:15px}
.tast .what{font-size:14px;margin-top:1px}
.tast .what i{font-family:var(--serif);font-size:15px;color:var(--muted)}
.tast .quote{font-size:14.5px;margin-top:4px}
.tast .tags{margin-top:5px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);z-index:30;color:var(--muted)}
#loading b{font:600 30px var(--serif);color:var(--accent);animation:breathe 1.6s ease-in-out infinite}

.enter{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let CFG = store.get('cave-cfg');
async function call(cfg, action, args) {
  let r;
  const netErr = () => Object.assign(new Error('Pas de connexion au script (réseau ou adresse incorrecte).'), { net: true });
  if (navigator.onLine === false) throw netErr();
  try {
    r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ key: cfg.key, action, args }) });
  } catch (e) { throw netErr(); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Réponse inattendue : vérifie l\'adresse et que le script est déployé pour « Tout le monde ».'); }
  if (!j.ok) throw new Error(j.error || 'Erreur inconnue');
  return j.data;
}
const run = (action, ...args) => call(CFG, action, args);
const APP_VERSION = '19 nov. 2026 · 3';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const keyOf = b => [b.zone, b.cote, b.couleur, b.domaine, b.appellation, b.cuvee, b.millesime].join('|');
const uniq = a => [...new Set(a.filter(Boolean))].sort((x, y) => x.localeCompare(y, 'fr'));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const frDate = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${Number(p[2])} ${MOIS[Number(p[1]) - 1]} ${p[0]}` : esc(s); };
const colorCls = c => { const n = norm(c); return n.startsWith('rouge') ? 'rouge' : n.startsWith('blanc') ? 'blanc' : n.startsWith('ros') ? 'rose' : n.startsWith('champ') ? 'champagne' : ''; };
const kind = b => colorCls(b.couleur) || 'autre';
const KORDER = ['rouge', 'blanc', 'rose', 'champagne', 'autre'];
const KNAME = { rouge: ['rouge', 'rouges'], blanc: ['blanc', 'blancs'], rose: ['rosé', 'rosés'], champagne: ['champagne', 'champagnes'], autre: ['autre', 'autres'] };
const plural = (n, w, ws) => `${n} ${n > 1 ? (ws || w + 's') : w}`;
const icon = (id, cls) => `<svg class="ic${cls ? ' ' + cls : ''}"><use href="#i-${id}"/></svg>`;
const bottleIcon = k => `<svg class="btl k-${k}" viewBox="0 0 16 40" aria-hidden="true"><use href="#i-bottle"/></svg>`;
const fmtNote = n => String(n).replace('.', ',');

let D = { bottles: [], drunk: [] };
const F = { q: '', couleur: '', region: '', sort: store.get('cave-sort') || 'region' };

function toast(msg, ms) { const t = $('#toast'); t.classList.remove('act'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms || 2600); }
function toastUndo(msg, onUndo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span><button type="button" id="t-undo">Annuler</button>`;
  t.classList.add('show', 'act'); clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show', 'act'), 6500);
  $('#t-undo').onclick = () => { clearTimeout(t._h); t.classList.remove('show', 'act'); onUndo(); };
}
function fail(e) { toast('⚠️ ' + (e && e.message ? e.message : e), 8000); }

async function load() {
  if (!CFG) return showSetup();
  const cached = store.get('cave-data');
  if (cached) { setData(cached); $('#loading').hidden = true; toast('Mise à jour…'); }
  else $('#loading').hidden = false;
  try {
    if (QUEUE.length) await sync(true); // sinon la version du serveur effacerait les actions pas encore envoyées
    if (!QUEUE.length) { setData(await run('getData')); if (cached) toast('À jour'); probeUndoDrink(); }
    else toast(`Hors connexion · ${plural(QUEUE.length, 'action')} en attente`);
  } catch (e) { e.net && cached ? toast('Hors connexion · dernière version enregistrée') : fail(e); }
  $('#loading').hidden = true;
}

function showSetup() {
  $('#loading').hidden = true;
  $('#setup').hidden = false;
  document.querySelectorAll('body > main, nav').forEach(x => x.hidden = true);
  $('#cfg-url').value = CFG ? CFG.url : '';
  $('#cfg-key').value = CFG ? CFG.key : '';
  $('#cfg-cancel').hidden = !CFG;
}
function hideSetup() {
  $('#setup').hidden = true;
  document.querySelectorAll('body > main, nav').forEach(x => x.hidden = false);
}
$('#cfg-ok').onclick = async () => {
  const cfg = { url: $('#cfg-url').value.trim(), key: $('#cfg-key').value.trim() };
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(cfg.url)) return toast('L\'adresse doit commencer par https://script.google.com/ et finir par /exec');
  if (!cfg.key) return toast('Colle ta clé secrète');
  const b = $('#cfg-ok'); b.disabled = true; b.textContent = 'Connexion…';
  try {
    const d = await call(cfg, 'getData', []);
    CFG = cfg; store.set('cave-cfg', cfg); hideSetup(); setData(d); toast('Connecté');
  } catch (e) { fail(e); }
  b.disabled = false; b.textContent = 'Se connecter';
};
$('#cfg-cancel').onclick = hideSetup;
$('#settings').onclick = showSetup;
$('#app-version').textContent = APP_VERSION;

function setData(d) {
  D = d;
  store.set('cave-data', d);
  const fill = (id, vals) => $(id).innerHTML = vals.map(v => `<option value="${esc(v)}">`).join('');
  const B = D.bottles;
  fill('#dl-couleur', uniq(['Rouge', 'Blanc', 'Rosé', 'Champagne', ...B.map(b => b.couleur)]));
  fill('#dl-region', uniq(B.map(b => b.region).concat(D.drunk.map(b => b.region))));
  fill('#dl-domaine', uniq(B.map(b => b.domaine).concat(D.drunk.map(b => b.domaine))));
  fill('#dl-appellation', uniq(B.map(b => b.appellation).concat(D.drunk.map(b => b.appellation))));
  fill('#dl-cuvee', uniq(B.map(b => b.cuvee)));

  const total = B.reduce((s, b) => s + b.nb, 0);
  $('#head-sub').textContent = `${plural(total, 'bouteille')} · ${plural(new Set(B.map(b => b.domaine)).size, 'domaine')}`;

  const couleurs = uniq(B.map(b => b.couleur));
  if (F.couleur && !couleurs.includes(F.couleur)) F.couleur = '';
  $('#f-couleur').innerHTML = ['', ...couleurs].map(c =>
    `<button class="chip ${F.couleur === c ? 'on' : ''}${c ? ' k-' + kind({ couleur: c }) : ''}" data-c="${esc(c)}">${c ? '<i class="sw"></i>' + esc(c) : 'Toutes'}</button>`).join('');

  const setOpts = (id, first, vals, cur, label) => {
    $(id).innerHTML = `<option value="">${first}</option>` + vals.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(label ? label(v) : v)}</option>`).join('');
  };
  setOpts('#f-region', 'Toutes les régions', uniq(B.map(b => b.region)), F.region);
  $('#f-sort').value = F.sort;

  renderCave(); renderZones(); renderBues(); renderStats();
  if (!$('#add-form').innerHTML) renderAdd();
}

/* ---------- Liste ---------- */
function cardHtml(b) {
  return `<div class="card tap" data-row="${b.row}">
      ${bottleIcon(kind(b))}
      <div class="grow"><div class="dom">${esc(b.domaine)}</div>
        <div class="app">${esc(b.appellation)}${b.cuvee ? ` <i>· ${esc(b.cuvee)}</i>` : ''}</div>
        <div class="meta">${esc(b.region)}</div></div>
      <div class="vint"><b>${esc(b.millesime || 'NM')}</b><span>×${b.nb}</span></div></div>`;
}

/* Un « vin » = même couleur, région, domaine, appellation, cuvée et millésime, quel que soit l'emplacement */
const wineKey = b => [b.couleur, b.region, b.domaine, b.appellation, b.cuvee, b.millesime].join('|');
const placeOrder = (z, c) => Number(z) * 2 + (c === 'Avant' ? 0 : 1);
function wines() {
  const m = new Map();
  D.bottles.forEach(b => {
    const k = wineKey(b);
    if (!m.has(k)) m.set(k, { key: k, couleur: b.couleur, region: b.region, domaine: b.domaine, appellation: b.appellation, cuvee: b.cuvee, millesime: b.millesime, nb: 0, locs: [] });
    const w = m.get(k); w.nb += b.nb; w.locs.push(b);
  });
  m.forEach(w => w.locs.sort((a, b) => placeOrder(a.zone, a.cote) - placeOrder(b.zone, b.cote)));
  return [...m.values()];
}
const findWine = key => wines().find(w => w.key === key);
const descOf = w => ({ couleur: w.couleur, region: w.region, domaine: w.domaine, appellation: w.appellation, cuvee: w.cuvee, millesime: w.millesime });

// Tri des domaines sans « Domaine », « Château », « Mas »… ni l'article : « Domaine du Monteillet » se range à M
const domSort = d => norm(d).replace(/^(domaines?|chateau|mas|maison|clos|vignobles?|cave)\s+/, '').replace(/^(de la|des|du|de|d'|l'|la|le|les)\s*/, '').trim();
const cmpTxt = (a, b) => String(a || '').localeCompare(String(b || ''), 'fr', { sensitivity: 'base' });
const cmpMil = (a, b) => (Number(a.millesime) || 9999) - (Number(b.millesime) || 9999);
const cmpDom = (a, b) => cmpTxt(domSort(a.domaine), domSort(b.domaine));
const SORTS = {
  region: { cmp: (a, b) => cmpTxt(a.region, b.region) || cmpDom(a, b) || cmpMil(a, b) || cmpTxt(a.cuvee, b.cuvee), grp: w => w.region || 'Sans région', meta: w => w.couleur },
  domaine: { cmp: (a, b) => cmpDom(a, b) || cmpTxt(a.domaine, b.domaine) || cmpMil(a, b) || cmpTxt(a.cuvee, b.cuvee), grp: w => (domSort(w.domaine)[0] || '#').toUpperCase(), meta: w => w.region },
  millesime: { cmp: (a, b) => cmpMil(a, b) || cmpTxt(a.region, b.region) || cmpDom(a, b), grp: w => w.millesime || 'Sans millésime', meta: w => w.region },
  couleur: { cmp: (a, b) => KORDER.indexOf(kind(a)) - KORDER.indexOf(kind(b)) || cmpTxt(a.couleur, b.couleur) || cmpTxt(a.region, b.region) || cmpDom(a, b) || cmpMil(a, b), grp: w => w.couleur || 'Autre', meta: w => w.region },
};

function wineCardHtml(w, meta) {
  return `<div class="card tap" data-w="${esc(w.key)}">
      ${bottleIcon(kind(w))}
      <div class="grow"><div class="dom">${esc(w.domaine)}</div>
        <div class="app">${esc(w.appellation)}${w.cuvee ? ` <i>· ${esc(w.cuvee)}</i>` : ''}</div>
        <div class="meta">${esc(meta)}</div></div>
      <div class="vint"><b>${esc(w.millesime || 'NM')}</b><span>×${w.nb}</span></div></div>`;
}

function renderCave() {
  const q = norm(F.q).split(/\s+/).filter(Boolean), S = SORTS[F.sort] || SORTS.region;
  const list = wines().filter(w =>
    (!F.couleur || w.couleur === F.couleur) && (!F.region || w.region === F.region) &&
    q.every(t => norm([w.domaine, w.appellation, w.cuvee, w.region, w.millesime, w.couleur].join(' ')).includes(t))
  ).sort(S.cmp);

  const n = list.reduce((s, w) => s + w.nb, 0);
  $('#cave-summary').textContent = `${plural(n, 'bouteille')} · ${plural(list.length, 'vin')}`;
  if (!list.length) { $('#cave-list').innerHTML = `<div class="empty">${icon('search')}<b>Aucun vin trouvé</b>Essaie un autre mot ou retire un filtre.</div>`; return; }

  let html = '', grp = null;
  list.forEach(w => {
    const g = S.grp(w);
    if (g !== grp) { grp = g; html += `<div class="group">${esc(g)}</div>`; }
    html += wineCardHtml(w, S.meta(w));
  });
  $('#cave-list').innerHTML = html;
}

/* ---------- Visuels des régions (filigrane de la fiche) ---------- */
// Chaque région connue a son dessin ; toute autre région (Tokaj, Danemark, nouvelle région…) prend le générique
const REGIONS = [
  ['rhone-nord', /rhone.*nord/], ['rhone-sud', /rhone.*sud/], ['bourgogne', /bourgogne/], ['bordeaux', /bordeaux/],
  ['beaujolais', /beaujolais/], ['jura', /jura(?!nd)/], ['loire', /loire/], ['languedoc', /languedoc/], ['savoie', /savoie/],
  ['provence', /provence/], ['champagne', /champagne/], ['alsace', /alsace/], ['grece', /grece|peloponnese/]
];
const regionVisual = r => { const n = norm(r); const m = REGIONS.find(([, re]) => re.test(n)); return m ? m[0] : 'generique'; };

/* ---------- Zones (casier) ---------- */
// Emplacements réels du casier : la zone 1 n'a qu'un côté Avant (à l'arrière, c'est le moteur de la cave)
const CASIER = { '1': ['Avant'], '2': ['Avant', 'Arrière'], '3': ['Avant', 'Arrière'], '4': ['Avant', 'Arrière'], '5': ['Avant', 'Arrière'] };
let ZSEL = null; // emplacement ouvert : { zone, cote } ou null
const sortBottles = (a, b) => a.domaine.localeCompare(b.domaine, 'fr') || String(a.millesime).localeCompare(String(b.millesime));

function places() {
  // Les 9 emplacements du casier, plus tout emplacement inattendu présent dans la feuille
  const list = [];
  Object.entries(CASIER).forEach(([z, cs]) => cs.forEach(c => list.push({ zone: z, cote: c })));
  D.bottles.forEach(b => { if (!list.some(p => p.zone === b.zone && p.cote === b.cote)) list.push({ zone: b.zone, cote: b.cote }); });
  return list.map(p => ({ ...p, bottles: D.bottles.filter(b => b.zone === p.zone && b.cote === p.cote) }));
}
function countBy(bottles) { const by = {}; bottles.forEach(b => { const k = kind(b); by[k] = (by[k] || 0) + b.nb; }); return by; }
function rackHtml(bottles, big) {
  const culs = [];
  KORDER.forEach(k => bottles.filter(b => kind(b) === k).sort(sortBottles).forEach(b => { for (let i = 0; i < b.nb; i++) culs.push(k); }));
  if (!culs.length) return `<div class="rack${big ? ' big' : ''}">${'<i class="cul libre"></i>'.repeat(big ? 8 : 6)}</div>`;
  return `<div class="rack${big ? ' big' : ''}">${culs.map((k, i) => `<i class="cul k-${k}" style="--i:${i}"></i>`).join('')}</div>`;
}
function legendHtml(by) {
  return KORDER.filter(k => by[k]).map(k => `<span class="k-${k}"><i></i>${plural(by[k], KNAME[k][0], KNAME[k][1])}</span>`).join('');
}

function renderZones() {
  if (ZSEL) return renderZone();
  const P = places();
  const tot = P.reduce((s, p) => s + p.bottles.reduce((t, b) => t + b.nb, 0), 0);
  const vides = P.filter(p => !p.bottles.length).length;
  $('#v-zones').innerHTML = `
    <div class="view-title">Le casier</div>
    <div class="summary">${plural(tot, 'bouteille')} · ${vides ? plural(vides, 'emplacement vide', 'emplacements vides') : 'aucun emplacement vide'}</div>
    <div class="places">${P.map(p => {
      const n = p.bottles.reduce((s, b) => s + b.nb, 0);
      const wide = P.filter(q => q.zone === p.zone).length === 1 ? ' wide' : ''; // zone à un seul côté : toute la largeur
      const head = `<span class="ph"><span class="zn">Zone ${esc(p.zone)}</span><span class="zc">${esc(p.cote)}</span></span>`;
      if (!n) return `<button class="place vide${wide}" data-z="${esc(p.zone)}" data-c="${esc(p.cote)}">${head}${rackHtml([])}<span class="pc">Vide · place disponible</span></button>`;
      return `<button class="place${wide}" data-z="${esc(p.zone)}" data-c="${esc(p.cote)}">${head}${rackHtml(p.bottles)}<span class="pc"><b>${plural(n, 'bouteille')}</b></span></button>`;
    }).join('')}</div>`;
}

function renderZone() {
  const { zone, cote } = ZSEL;
  const list = D.bottles.filter(b => b.zone === zone && b.cote === cote).sort(sortBottles);
  const n = list.reduce((s, b) => s + b.nb, 0);
  $('#v-zones').innerHTML = `
    <button class="back" id="z-back">${icon('back')}Le casier</button>
    <div class="view-title">Zone ${esc(zone)} <span style="color:var(--gold)">·</span> ${esc(cote)}</div>
    ${rackHtml(list, true)}
    <div class="legend">${n ? legendHtml(countBy(list)) : 'Emplacement vide : place disponible.'}</div>
    ${list.length ? `<div class="group">${plural(list.length, 'référence')} · ${plural(n, 'bouteille')}</div>` + list.map(cardHtml).join('') : ''}
    <button class="btn ghost" id="z-add">${icon('plus')}Ajouter une bouteille ici</button>`;
}

function openZone(zone, cote) {
  ZSEL = { zone, cote };
  try { history.pushState({ zone: 1 }, ''); } catch (e) {}
  renderZones(); animateIn($('#v-zones')); window.scrollTo(0, 0);
}
function closeZone() { ZSEL = null; renderZones(); animateIn($('#v-zones')); window.scrollTo(0, 0); }

$('#v-zones').onclick = e => {
  const p = e.target.closest('.place'); if (p) return openZone(p.dataset.z, p.dataset.c);
  if (e.target.closest('#z-back')) { if (history.state && history.state.zone) history.back(); else closeZone(); return; }
  if (e.target.closest('#z-add')) { renderAdd({ zone: ZSEL.zone, cote: ZSEL.cote, nb: 1 }); showView('add'); return; }
  const c = e.target.closest('.card'); if (c) { const b = D.bottles.find(x => x.row === Number(c.dataset.row)); if (b) showWine(wineKey(b), true); }
};
// Bouton « retour » du téléphone : revient à la grille des zones au lieu de quitter l'app
window.addEventListener('popstate', () => { if (ZSEL) closeZone(); });

/* ---------- Volet du bas ---------- */
let sheetTimer;
function openSheet(html) {
  const s = $('#sheet'), p = $('#sheet-panel');
  clearTimeout(sheetTimer);
  p.innerHTML = '<div class="grip"></div>' + html;
  if (s.hidden || !s.classList.contains('open')) {
    s.hidden = false; void s.offsetWidth; s.classList.add('open');
  } else { p.scrollTop = 0; animateIn(p); }
}
function closeSheet() {
  const s = $('#sheet'); if (s.hidden) return;
  s.classList.remove('open');
  sheetTimer = setTimeout(() => { s.hidden = true; }, 300);
}

function labelHtml(w) {
  return `<div class="label k-${kind(w)}">
      <svg class="wm" viewBox="0 0 320 180" preserveAspectRatio="xMidYMax meet" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#r-${regionVisual(w.region)}"/></svg>
      <div class="lab-reg">${esc(w.region)}${w.region && w.couleur ? ' · ' : ''}${esc(w.couleur)}</div>
      <div class="lab-dom">${esc(w.domaine)}</div>
      <div class="lab-app">${esc(w.appellation)}</div>
      ${w.cuvee ? `<div class="lab-cuv">${esc(w.cuvee)}</div>` : ''}
      <div class="lab-vint">${esc(w.millesime || 'NM')}</div>
      <div class="lab-orn"></div>
    </div>`;
}
const placeName = p => `Zone ${p.zone} · ${p.cote}`;

// Tes dégustations de ce vin (tous millésimes), puis des autres vins du même domaine ; les plus récentes d'abord
function tastingsHtml(w) {
  const dom = D.drunk.filter(x => norm(x.domaine) === norm(w.domaine)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!dom.length) return '';
  const isThis = x => norm(x.appellation) === norm(w.appellation) && norm(x.cuvee) === norm(w.cuvee);
  const item = x => `<div class="tast">
      ${x.note !== '' ? `<div class="note"><b>${fmtNote(x.note)}</b><span>/20</span></div>` : ''}
      <div class="grow"><div class="date">${frDate(x.date)} · ${esc(x.millesime || 'NM')}</div>
        ${isThis(x) ? '' : `<div class="what">${esc(x.appellation)}${x.cuvee ? ` <i>· ${esc(x.cuvee)}</i>` : ''}</div>`}
        ${x.stade || x.racheter === 'Oui' ? `<div class="tags">${x.stade ? `<span class="tag">${icon('clock')}${esc(x.stade)}</span>` : ''}${x.racheter === 'Oui' ? `<span class="tag">${icon('cart')}À racheter</span>` : ''}</div>` : ''}
        ${x.commentaire ? `<div class="quote">« ${esc(x.commentaire)} »</div>` : ''}</div></div>`;
  const mine = dom.filter(isThis), others = dom.filter(x => !isThis(x));
  return (mine.length ? `<div class="group">Tes dégustations de ce vin</div><div class="tasts">${mine.slice(0, 5).map(item).join('')}</div>` : '')
    + (others.length ? `<div class="group">Autres vins de ce domaine</div><div class="tasts">${others.slice(0, 4).map(item).join('')}</div>` : '');
}

function showWine(key, open) {

    <div class="locs" id="w-locs" ${open ? '' : 'hidden'}>${w.locs.map(l => `<button class="loc" data-z="${esc(l.zone)}" data-c="${esc(l.cote)}">${icon('pin')}<span>${esc(placeName(l))}</span><b>${plural(l.nb, 'bouteille')}</b>${icon('chev')}</button>`).join('')}</div>
    <button class="btn" id="w-drink">${icon('glass')}J'ouvre une bouteille</button>

  const back = () => showWine(key, true);

      w.locs.map(l => ({ label: placeName(l), hint: plural(l.nb, 'bouteille'), loc: l })), o => drinkForm(o.loc, back), back);
  $('#w-plus').onclick = () => pickSheet('Où ranges-tu la bouteille ?', esc(`${w.domaine} · ${w.millesime || 'NM'}`), placeOptions(w), o => {

}

// Choix d'un emplacement : d'abord ceux où le vin se trouve déjà, puis les autres du casier
function placeOptions(w, exclude) {
  const all = []; Object.entries(CASIER).forEach(([z, cs]) => cs.forEach(c => all.push({ zone: z, cote: c })));
  const same = p => q => q.zone === p.zone && q.cote === p.cote;
  const here = w.locs.filter(l => !(exclude && same(exclude)(l)));
  const others = all.filter(p => !w.locs.some(same(p)) && !(exclude && same(exclude)(p)));
  const fill = p => D.bottles.filter(same(p)).reduce((s, b) => s + b.nb, 0);
  const opts = here.map(l => ({ zone: l.zone, cote: l.cote, label: placeName(l), hint: `Ce vin y est déjà (${plural(l.nb, 'bouteille')})`, loc: l }));
  if (others.length) opts.push({ sep: here.length ? 'Autres emplacements' : 'Emplacements' });
  others.forEach(p => { const n = fill(p); opts.push({ ...p, label: placeName(p), hint: n ? `${plural(n, 'bouteille')} au total` : 'Vide' }); });
  return opts;
}

function pickSheet(title, sub, opts, onPick, back) {
  openSheet(`<button class="back" id="pk-back">${icon('back')}Retour</button><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}
    <div class="opts">${opts.map((o, i) => o.sep ? `<div class="group">${esc(o.sep)}</div>`
      : `<button class="opt" data-i="${i}">${icon('pin')}<span>${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</span>${icon('chev')}</button>`).join('')}</div>`);
  $('#pk-back').onclick = back;
  $('#sheet-panel .opts').onclick = e => { const b = e.target.closest('.opt'); if (b) onPick(opts[Number(b.dataset.i)]); };
}

// Déplacer : d'où (si plusieurs emplacements) → vers où → combien (s'il y en a plusieurs)
function moveFlow(w, back) {
  const toWhere = src => {
    const backHere = () => w.locs.length > 1 ? fromWhere() : back();
    pickSheet('Vers quel emplacement ?', `Depuis ${esc(placeName(src))}`, placeOptions(w, src), dst => {
      if (src.nb === 1) return doMove(src, dst, 1);
      let q = 1;
      openSheet(`<button class="back" id="mv-back">${icon('back')}Retour</button><h2>Combien de bouteilles ?</h2>
        <div class="sub">${esc(placeName(src))} → ${esc(placeName(dst))}</div>
        <div class="qty"><button type="button" id="mv-minus" aria-label="Une de moins">−</button><b id="mv-n">1</b><button type="button" id="mv-plus" aria-label="Une de plus">+</button></div>
        <div class="meta" style="text-align:center">sur ${plural(src.nb, 'bouteille')} à cet emplacement</div>
        <button class="btn" id="mv-ok">${icon('move')}Déplacer</button>`);
      const upd = d => { q = Math.min(src.nb, Math.max(1, q + d)); $('#mv-n').textContent = q; };
      $('#mv-minus').onclick = () => upd(-1); $('#mv-plus').onclick = () => upd(1);
      $('#mv-back').onclick = () => toWhere(src);
      $('#mv-ok').onclick = () => doMove(src, dst, q);
    }, backHere);
  };
  const fromWhere = () => pickSheet('Quelle bouteille déplaces-tu ?', 'Choisis son emplacement actuel.',
    w.locs.map(l => ({ label: placeName(l), hint: plural(l.nb, 'bouteille'), loc: l })), o => toWhere(o.loc), back);
  const doMove = (src, dst, q) => saveSeq([
    // ajout à la destination d'abord : en cas de coupure, aucune bouteille n'est perdue
    dst.loc ? ['updateBottle', [dst.loc.row, keyOf(dst.loc), { ...dst.loc, nb: dst.loc.nb + q }]] : ['addBottle', [{ ...descOf(w), zone: dst.zone, cote: dst.cote, nb: q }]],
    ['updateBottle', [src.row, keyOf(src), { ...src, nb: src.nb - q }]]
  ], `${plural(q, 'bouteille déplacée', 'bouteilles déplacées')} en ${placeName(dst)}`);
  w.locs.length > 1 ? fromWhere() : toWhere(w.locs[0]);
}

// Modifier : la description s'applique à tous les emplacements ; quantité par emplacement (0 = retirer sans la boire)
function editWine(w, back) {
  const qtys = `<label>Bouteilles par emplacement</label>${w.locs.map((l, i) => `<div class="locq"><span>${esc(placeName(l))}</span><input type="number" min="0" inputmode="numeric" id="q-${i}" value="${l.nb}" aria-label="Bouteilles en ${esc(placeName(l))}"></div>`).join('')}
    <div class="meta" style="margin-top:8px">Mettre 0 retire les bouteilles de cet emplacement, sans les ajouter aux bues.</div>`;
  openSheet(`<button class="back" id="ed-back">${icon('back')}Retour</button><h2>Modifier</h2>` + wineForm(w, 'desc', qtys));
  $('#ed-back').onclick = back;
  bindWineForm($('#sheet-panel'), o => {
    const n = w.locs.map((l, i) => Math.max(0, Math.round(Number($('#q-' + i).value) || 0)));
    return saveSeq(w.locs.map((l, i) => ['updateBottle', [l.row, keyOf(l), { ...o, zone: l.zone, cote: l.cote, nb: n[i] }]]),

}

/* ---------- Actions : enregistrement, hors connexion, annulation ----------
   Chaque action est une liste d'appels au script. Avant de l'envoyer, l'app calcule localement
   le résultat attendu (affiché tout de suite si le réseau manque) et les appels inverses (pour « Annuler »). */
const clone = o => JSON.parse(JSON.stringify(o));
const txt_ = x => x == null ? '' : String(x).trim();
const rowOf = o => ({ zone: txt_(Number(o.zone)), cote: txt_(o.cote), couleur: txt_(o.couleur), region: txt_(o.region), domaine: txt_(o.domaine),
  appellation: txt_(o.appellation), cuvee: txt_(o.cuvee), millesime: txt_(o.millesime), nb: Math.max(0, Math.round(Number(o.nb) || 0)) });
function checkRow(o, allowZero) {
  if (!o || !txt_(o.domaine)) throw new Error('Le domaine est obligatoire.');
  if (!(Number(o.zone) >= 1 && Number(o.zone) <= 5)) throw new Error('La zone doit être entre 1 et 5.');
  if (!['Avant', 'Arrière'].includes(txt_(o.cote))) throw new Error('Le côté doit être Avant ou Arrière.');
  if (!(Number(o.nb) >= (allowZero ? 0 : 1))) throw new Error('Nombre de bouteilles invalide.');
}
function rowIndex(d, row, key) {
  let i = d.bottles.findIndex(b => b.row === row && keyOf(b) === key);
  if (i < 0) i = d.bottles.findIndex(b => keyOf(b) === key);
  if (i < 0) throw new Error('Ce vin a été modifié ailleurs. Actualise et réessaie.');
  return i;
}
const sameTasting = (x, t) => x.date === t.date && x.domaine === t.domaine && x.appellation === t.appellation && x.cuvee === t.cuvee && txt_(x.millesime) === txt_(t.millesime);
// Même logique que le script, appliquée à la copie locale des données
const LOCAL = {
  addBottle(d, o) {
    d = clone(d); checkRow(o); const v = rowOf(o), i = d.bottles.findIndex(b => keyOf(b) === keyOf(v));
    if (i >= 0) d.bottles[i].nb += v.nb; else d.bottles.push({ ...v, row: Math.max(1, ...d.bottles.map(b => b.row)) + 1 });
    return d;
  },
  updateBottle(d, row, key, o) {
    d = clone(d); checkRow(o, true); const i = rowIndex(d, row, key), v = rowOf(o);
    if (v.nb <= 0) d.bottles.splice(i, 1); else d.bottles[i] = { ...v, row: d.bottles[i].row };
    return d;
  },
  drinkBottle(d, row, key, t) {
    d = clone(d); const i = rowIndex(d, row, key), b = d.bottles[i];
    const note = t.note === '' || t.note == null ? '' : Math.max(0, Math.min(20, Number(String(t.note).replace(',', '.'))));
    d.drunk.push({ date: t.date || today(), couleur: b.couleur, region: b.region, domaine: b.domaine, appellation: b.appellation, cuvee: b.cuvee,
      millesime: b.millesime, note, stade: txt_(t.stade), racheter: txt_(t.racheter), commentaire: txt_(t.commentaire) });
    if (b.nb > 1) b.nb--; else d.bottles.splice(i, 1);
    return d;
  },
  undoDrink(d, t) {
    d = clone(d);
    for (let i = d.drunk.length - 1; i >= 0; i--) if (sameTasting(d.drunk[i], t)) { d.drunk.splice(i, 1); return d; }
    throw new Error('Dégustation introuvable.');
  }
};
// Appels qui défont un appel donné, calculés sur l'état juste avant cet appel
function inverseOf(d, fn, args) {
  if (fn === 'addBottle') {
    const v = rowOf(args[0]), ex = d.bottles.find(b => keyOf(b) === keyOf(v));
    return [['updateBottle', [0, keyOf(v), ex ? { ...ex } : { ...v, nb: 0 }]]];
  }
  if (fn === 'updateBottle') {
    const [row, key, o] = args, prev = { ...d.bottles[rowIndex(d, row, key)] }, v = rowOf(o);
    return v.nb > 0 ? [['updateBottle', [0, keyOf(v), prev]]] : [['addBottle', [prev]]];
  }
  if (fn === 'drinkBottle') {
    const [row, key, t] = args, b = d.bottles[rowIndex(d, row, key)];
    // d'abord remettre la bouteille, ensuite effacer la dégustation : en cas d'échec, aucune bouteille n'est perdue
    return [['addBottle', [{ ...b, nb: 1 }]], ['undoDrink', [{ date: t.date || today(), domaine: b.domaine, appellation: b.appellation, cuvee: b.cuvee, millesime: b.millesime }]]];
  }
  return [];
}

// Le script sait-il annuler une dégustation (action « undoDrink », ajoutée dans une version plus récente du script) ?
// Sonde sans effet : une dégustation fictive qui ne correspond à aucune ligne.
let CAN_UNDO_DRINK = store.get('cave-undo-drink') === true;
async function probeUndoDrink() {
  if (CAN_UNDO_DRINK) return;
  try { await run('undoDrink', { date: '0000-00-00', domaine: '\u0000sonde' }); CAN_UNDO_DRINK = true; }
  catch (e) { if (e.net) return; CAN_UNDO_DRINK = !/Action inconnue/i.test(e.message); }
  store.set('cave-undo-drink', CAN_UNDO_DRINK);
}

// File d'attente des actions faites sans réseau (gardée sur l'appareil, envoyée au retour du réseau)
let QUEUE = store.get('cave-queue') || [], SYNCING = false;
function saveQueue() { store.set('cave-queue', QUEUE); const b = $('#pending'); b.hidden = !QUEUE.length; $('#pending-n').textContent = QUEUE.length; }
async function sync(silent) {
  if (!QUEUE.length || SYNCING) return;
  SYNCING = true; let d = null; const refused = [];
  try {
    while (QUEUE.length) {
      const [fn, args] = QUEUE[0];
      try { d = await run(fn, ...args); }
      catch (e) { if (e.net) throw e; refused.push(e.message); } // refusée par le script : on l'écarte et on continue
      QUEUE.shift(); saveQueue();
    }
    setData(d || await run('getData'));
    toast(refused.length ? `Synchronisé · ${plural(refused.length, 'action')} non appliquée${refused.length > 1 ? 's' : ''} : ${refused[0]}` : 'Actions en attente enregistrées');
  } catch (e) { if (!silent) toast(e.net ? `Toujours hors connexion · ${plural(QUEUE.length, 'action')} en attente` : '⚠️ ' + e.message); }
  finally { SYNCING = false; }
}

// Ce que fait chaque appel, en clair (pour expliquer un échec en cours de route)
function stepLabel(fn, args) {
  const o = fn === 'addBottle' ? args[0] : fn === 'updateBottle' ? args[2] : fn === 'undoDrink' ? args[0] : D.bottles.find(b => keyOf(b) === args[1]) || {};
  const vin = `${o.domaine || 'le vin'}${o.millesime ? ' ' + o.millesime : ''}`;
  if (fn === 'addBottle') return `remettre ${vin} en ${placeName(o)}`;
  if (fn === 'updateBottle') return `mettre à jour ${vin}${o.zone ? ' en ' + placeName(o) : ''}`;
  if (fn === 'drinkBottle') return `retirer ${vin} de la cave`;
  if (fn === 'undoDrink') return `effacer la dégustation de ${vin} dans « Bouteilles bues »`;
  return fn;
}

async function perform(calls, msg, undoable = true) {
  // 1. Résultat attendu et appels inverses (vérifie aussi les données avant tout envoi)
  let expected = D, inverse = [];
  try { for (const [fn, args] of calls) { inverse = inverseOf(expected, fn, args).concat(inverse); expected = LOCAL[fn](expected, ...args); } }
  catch (e) { fail(e); return false; }
  const btns = document.querySelectorAll('.sheet .btn, #v-add .btn'); btns.forEach(x => x.disabled = true);
  let d = null, i = 0, queued = false;
  try {
    // s'il reste des actions en attente, on passe derrière elles pour garder l'ordre
    if (QUEUE.length) throw Object.assign(new Error(''), { net: true });
    for (; i < calls.length; i++) d = await run(...[calls[i][0], ...calls[i][1]]);
    setData(d);
  } catch (e) {
    if (!e.net) {
      // Une étape a échoué : on dit précisément ce qui est fait et ce qui reste à faire
      if (i > 0) toast(`⚠️ Fait : ${calls.slice(0, i).map(c => stepLabel(...c)).join(', ')}. Pas fait : ${stepLabel(...calls[i])} (${e.message}). À corriger dans ta feuille.`, 12000);
      else fail(e);
      try { setData(await run('getData')); } catch (_) {}
      btns.forEach(x => x.disabled = false); return false;
    }
    // 2. Pas de réseau : on garde les appels restants et on affiche le résultat attendu
    const rest = calls.slice(i); let st = d || D;
    for (const [fn, args] of rest) st = LOCAL[fn](st, ...args);
    QUEUE.push(...rest); saveQueue(); setData(st); queued = true;
  }
  btns.forEach(x => x.disabled = false);
  closeSheet();
  const text = queued ? `${msg} · en attente de réseau` : msg;
  // pas de bouton Annuler pour une bouteille ouverte tant que le script ne sait pas effacer une dégustation
  const canUndo = undoable && inverse.length && (CAN_UNDO_DRINK || !inverse.some(([fn]) => fn === 'undoDrink'));
  if (canUndo) toastUndo(text, () => perform(inverse, 'Action annulée', false)); else toast(text);
  return true;
}
const save = (fn, args, msg) => perform([[fn, args]], msg);
const saveSeq = (calls, msg) => perform(calls, msg);

window.addEventListener('online', () => sync());
setInterval(() => { if (QUEUE.length && navigator.onLine !== false) sync(true); }, 30000);

  const id = edit ? 'e' : 'a', desc = edit === 'desc';
  return `<form class="wf" autocomplete="off">
    <label for="${id}-dom">Domaine *</label><input id="${id}-dom" name="domaine" list="dl-domaine" value="${v('domaine')}" required>
    <label for="${id}-app">Appellation</label><input id="${id}-app" name="appellation" list="dl-appellation" value="${v('appellation')}">

    <div class="row"><div><label for="${id}-coul">Couleur</label><input id="${id}-coul" name="couleur" list="dl-couleur" value="${v('couleur')}"></div>
      <div><label for="${id}-mil">Millésime</label><input id="${id}-mil" name="millesime" inputmode="numeric" maxlength="4" value="${v('millesime')}" placeholder="vide = NM"></div></div>
    <label for="${id}-reg">Région</label><input id="${id}-reg" name="region" list="dl-region" value="${v('region')}">

      <div><label for="${id}-z">Zone</label><select id="${id}-z" name="zone">${[1, 2, 3, 4, 5].map(z => `<option ${String(o.zone) === String(z) ? 'selected' : ''}>${z}</option>`).join('')}</select></div>
      <div><label for="${id}-c">Côté</label><select id="${id}-c" name="cote">${['Avant', 'Arrière'].map(c => `<option ${o.cote === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div><label for="${id}-nb">Bouteilles</label><input id="${id}-nb" name="nb" type="number" min="1" inputmode="numeric" value="${v('nb')}"></div>
    </div>`}
    <button class="btn" type="submit">${edit ? 'Enregistrer' : icon('plus') + 'Ajouter à la cave'}</button></form>`;
}

function bindWineForm(root, onSubmit) {
  const f = root.querySelector('form.wf');
  const syncCote = () => {
    if (!f.zone) return;
    const ok = CASIER[f.zone.value] || ['Avant', 'Arrière'];
    [...f.cote.options].forEach(o => { o.disabled = !ok.includes(o.value); });
    if (!ok.includes(f.cote.value)) f.cote.value = ok[0];
  };
  if (f.zone) f.zone.addEventListener('change', syncCote); syncCote();
  // Domaine déjà connu : on pré-remplit la région si elle est vide
  f.domaine.addEventListener('change', () => {
    const known = D.bottles.concat(D.drunk).find(b => b.domaine === f.domaine.value);
    if (known && !f.region.value) f.region.value = known.region;
  });
  f.onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(f).entries());
    if (o.millesime && !/^\d{4}$/.test(o.millesime)) return toast('Millésime : 4 chiffres (ou vide)');
    if ('nb' in o) o.nb = Number(o.nb);
    if (await onSubmit(o) && f.closest('#v-add')) renderAdd();
  };
}

function renderAdd(prefill) {
  $('#add-form').innerHTML = wineForm(prefill || null, false);
  bindWineForm($('#add-form'), o => save('addBottle', [o], `${plural(o.nb, 'bouteille ajoutée', 'bouteilles ajoutées')}`));
}

/* ---------- Stats ---------- */
function donutHtml(by, total) {
  const R = 52, C = 2 * Math.PI * R, GAP = 2.5;
  let off = 0, segs = '';
  KORDER.filter(k => by[k]).forEach(k => {
    const len = by[k] / total * C;
    const vis = Math.max(len - GAP, 1);
    segs += `<circle class="seg k-${k}" cx="70" cy="70" r="${R}" fill="none" stroke="var(--c)" stroke-width="20" stroke-dasharray="${vis} ${C - vis}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${KNAME[k][1]} : ${by[k]}</title></circle>`;
    off += len;
  });
  const leg = KORDER.filter(k => by[k]).map(k => `<div class="k-${k}"><i></i><span>${KNAME[k][1][0].toUpperCase() + KNAME[k][1].slice(1)}</span><b>${by[k]}</b><em>${Math.round(by[k] / total * 100)} %</em></div>`).join('');
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Répartition par couleur">${segs}
    <text class="tot" x="70" y="76" text-anchor="middle">${total}</text><text class="tl" x="70" y="92" text-anchor="middle">BOUTEILLES</text></svg>
    <div class="dleg">${leg}</div></div>`;
}

// Infobulles des graphiques : titre + répartition par couleur
let TIPS = [];
function addTip(title, by) { TIPS.push({ title, by }); return TIPS.length - 1; }
function sumBy(by) { return KORDER.reduce((s, k) => s + (by[k] || 0), 0); }
function chartLegend(kinds) {
  return `<div class="legend">${kinds.map(k => `<span class="k-${k}"><i></i>${KNAME[k][1][0].toUpperCase() + KNAME[k][1].slice(1)}</span>`).join('')}</div>`;
}

function colChartHtml(byYear) {
  const years = Object.keys(byYear).map(Number);
  if (!years.length) return '<div class="meta">Aucun millésime renseigné.</div>';
  const min = Math.min(...years), max = Math.max(...years), cols = [];
  for (let y = min; y <= max; y++) cols.push([y, byYear[y] || {}]);
  const W = 340, H = 130, top = 16, base = H - 18, step = W / cols.length, bw = Math.max(3, Math.min(22, step - 2)), GAP = 2;
  const peak = Math.max(...cols.map(c => sumBy(c[1])));
  const every = cols.length > 18 ? 3 : cols.length > 10 ? 2 : 1;
  let out = `<line class="base" x1="0" x2="${W}" y1="${base + .5}" y2="${base + .5}"/>`;
  cols.forEach(([y, by], i) => {
    const n = sumBy(by), x = i * step + (step - bw) / 2;
    const h = n ? Math.max(3, n / peak * (base - top)) : 0;
    const ks = KORDER.filter(k => by[k]);
    const avail = h - GAP * Math.max(0, ks.length - 1);
    let cur = base, segs = '';
    ks.forEach((k, j) => {
      const sh = Math.max(1.5, by[k] / n * avail), yy = cur - sh;
      if (j === ks.length - 1) { // segment du haut : extrémité arrondie
        const r = Math.min(4, sh, bw / 2);
        segs += `<path class="seg k-${k}" d="M${x},${cur} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${cur} Z"/>`;
      } else segs += `<rect class="seg k-${k}" x="${x}" y="${yy}" width="${bw}" height="${sh}"/>`;
      cur = yy - GAP;
    });
    const t = addTip(String(y), by);
    out += `<g class="col" data-t="${t}"><rect class="hit" x="${i * step}" y="0" width="${step}" height="${H}"/>${segs}</g>`;
    if (n && n === peak) out += `<text class="vl" x="${x + bw / 2}" y="${base - h - 4}" text-anchor="middle">${n}</text>`;
    if ((y - min) % every === 0 || y === max) out += `<text class="ax" x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${y}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bouteilles par millésime et par couleur">${out}</svg>`;
}

function regionChartHtml(byRegion) {
  const reg = Object.entries(byRegion).sort((a, b) => sumBy(b[1]) - sumBy(a[1]));
  if (!reg.length) return '<div class="meta">Aucune région renseignée.</div>';
  const rmax = sumBy(reg[0][1]);
  return reg.map(([name, by], i) => {
    const n = sumBy(by), t = addTip(name, by);
    const parts = KORDER.filter(k => by[k]).map(k => `<i class="k-${k}" style="flex:${by[k]} 1 0"></i>`).join('');
    return `<div class="hbar" data-t="${t}"><div class="l">${esc(name)}</div><div class="t"><div class="f" style="width:${n / rmax * 100}%;animation-delay:${i * 30}ms">${parts}</div></div><div class="n">${n}</div></div>`;
  }).join('');
}

function renderStats() {
  const B = D.bottles;
  const total = B.reduce((s, b) => s + b.nb, 0);
  const by = countBy(B);
  const byYear = {}, byRegion = {}; let nm = 0;
  B.forEach(b => {
    const k = kind(b), y = Number(b.millesime), r = b.region || '—';
    if (y) { byYear[y] = byYear[y] || {}; byYear[y][k] = (byYear[y][k] || 0) + b.nb; } else nm += b.nb;
    byRegion[r] = byRegion[r] || {}; byRegion[r][k] = (byRegion[r][k] || 0) + b.nb;
  });
  const years = Object.keys(byYear).map(Number);
  const kinds = KORDER.filter(k => by[k]);
  TIPS = [];
  const notes = D.drunk.filter(b => b.note !== '');
  const avg = notes.length ? fmtNote((notes.reduce((s, b) => s + b.note, 0) / notes.length).toFixed(1)) : '–';
  const rach = D.drunk.filter(b => b.racheter === 'Oui');

  $('#v-stats').innerHTML = `
    <div class="view-title">Statistiques</div>
    <div class="kpis">
      <div class="kpi"><b>${total}</b><span>bouteilles</span></div>
      <div class="kpi"><b>${wines().length}</b><span>vins</span></div>
      <div class="kpi"><b>${new Set(B.map(b => b.domaine)).size}</b><span>domaines</span></div>
      <div class="kpi"><b>${years.length ? Math.min(...years) + '–' + String(Math.max(...years)).slice(2) : '–'}</b><span>millésimes</span></div>
    </div>
    <h2>Par couleur</h2><div class="panel">${total ? donutHtml(by, total) : '<div class="meta">Cave vide.</div>'}</div>
    <h2>Par millésime</h2><div class="panel chart colchart">${chartLegend(kinds)}${colChartHtml(byYear)}<div class="tip"></div>${nm ? `<div class="note-s">Plus ${plural(nm, 'bouteille')} sans millésime.</div>` : ''}<div class="note-s">Touche un bâton pour voir le détail.</div></div>
    <h2>Par région</h2><div class="panel chart">${chartLegend(kinds)}${regionChartHtml(byRegion)}<div class="tip"></div><div class="note-s">Touche une région pour voir le détail.</div></div>
    <h2>Dégustations</h2>
    <div class="kpis"><div class="kpi"><b>${D.drunk.length}</b><span>bouteilles bues</span></div><div class="kpi"><b>${avg}</b><span>note moyenne /20</span></div></div>
    ${rach.length ? `<h2>À racheter</h2>${rach.map(b => `<div class="card">${bottleIcon(kind(b))}<div class="grow"><div class="dom">${esc(b.domaine)}</div><div class="app">${esc(b.appellation)}${b.cuvee ? ` <i>· ${esc(b.cuvee)}</i>` : ''}</div></div><div class="vint"><b>${esc(b.millesime || 'NM')}</b></div></div>`).join('')}` : ''}`;
}

// Infobulle des graphiques (survol à la souris, toucher sur téléphone)
function hideTips() {
  document.querySelectorAll('#v-stats .chart').forEach(c => { c.classList.remove('focus'); c.querySelector('.tip').classList.remove('on'); });
  document.querySelectorAll('#v-stats .hl').forEach(x => x.classList.remove('hl'));
}
function chartTip(e) {
  const el = e.target.closest && e.target.closest('#v-stats [data-t]');
  hideTips();
  if (!el) return;
  const chart = el.closest('.chart'), tip = chart.querySelector('.tip'), d = TIPS[Number(el.dataset.t)];
  if (!d) return;
  const n = sumBy(d.by);
  tip.innerHTML = `<b>${esc(d.title)} · ${n ? plural(n, 'bouteille') : 'aucune bouteille'}</b>` +
    KORDER.filter(k => d.by[k]).map(k => `<div class="k-${k}"><i></i>${plural(d.by[k], KNAME[k][0], KNAME[k][1])}</div>`).join('');
  el.classList.add('hl'); chart.classList.add('focus');
  // Position : au-dessus de la barre touchée, sans sortir du cadre
  const cr = chart.getBoundingClientRect();
  const segs = [...el.querySelectorAll('.seg, .f')].map(x => x.getBoundingClientRect()).filter(r => r.width && r.height);
  const ref = segs.length ? segs.reduce((a, r) => ({ left: Math.min(a.left, r.left), right: Math.max(a.right, r.right), top: Math.min(a.top, r.top) }), { left: Infinity, right: -Infinity, top: Infinity }) : el.getBoundingClientRect();
  tip.classList.add('on');
  const tw = tip.offsetWidth, cx = (ref.left + ref.right) / 2 - cr.left;
  tip.style.left = Math.min(Math.max(cx - tw / 2, 4), cr.width - tw - 4) + 'px';
  tip.style.top = (ref.top - cr.top) + 'px';
}
$('#v-stats').addEventListener('pointerover', e => { if (e.pointerType === 'mouse') chartTip(e); });
$('#v-stats').addEventListener('click', chartTip);
$('#v-stats').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTips(); });

});
$('#q').oninput = e => { F.q = e.target.value; renderCave(); };
$('#f-region').onchange = e => { F.region = e.target.value; renderCave(); };
$('#f-sort').onchange = e => { F.sort = e.target.value; store.set('cave-sort', F.sort); renderCave(); };
$('#f-couleur').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; F.couleur = c.dataset.c; setData(D); };
$('#cave-list').onclick = e => { const c = e.target.closest('.card'); if (c) showWine(c.dataset.w); };
$('.sheet-bg').onclick = closeSheet;
$('#refresh').onclick = load;
$('#pending').onclick = () => sync();
saveQueue();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
</body>
</html>
